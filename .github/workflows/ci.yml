name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: timeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 test_timeline.py

  smoke:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build image
        run: ./build.sh
      - name: Smoke test
        run: python3 smoke_test.py --image capcut-mcp:local
